name: WP1 contracts

on:
  push:
    paths: ["wp1-dao-collaboration/**", ".github/workflows/wp1-contracts.yml"]
  pull_request:
    paths: ["wp1-dao-collaboration/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp1-dao-collaboration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wp1-dao-collaboration/package-lock.json
      - run: npm ci
      - run: npx hardhat test
      - run: npm run demo
