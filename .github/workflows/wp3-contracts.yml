name: WP3 contracts

on:
  push:
    paths: ["wp3-ip-nft-fundraising/**", ".github/workflows/wp3-contracts.yml"]
  pull_request:
    paths: ["wp3-ip-nft-fundraising/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp3-ip-nft-fundraising
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wp3-ip-nft-fundraising/package-lock.json
      - run: npm ci
      - run: npx hardhat test
